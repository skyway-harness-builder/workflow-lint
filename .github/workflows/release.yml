name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-workflow-lint
  cancel-in-progress: false

jobs:
  release:
    # Free-plan org: no runner groups — select by labels only.
    runs-on: [self-hosted, macOS, ARM64, heavy]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          # Persistent self-hosted runner: local GOCACHE beats the cache API.
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
